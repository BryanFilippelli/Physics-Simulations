<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit Classifier Block Editor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .drop-line-hover {
      background-color: #f8fafc;
      border-bottom-color: #3b82f6 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-3 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-code-branch text-blue-400 text-xl"></i>
      <h1 class="text-base font-bold tracking-wide">Transit Classifier Block Editor</h1>
    </div>
    <button id="btn-clear" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded transition border border-slate-700">
      <i class="fa-solid fa-rotate-left mr-1"></i> Clear Editor
    </button>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto p-4 flex flex-col gap-5">

    <!-- Top Row: Blank Editor Canvas (Left) + Test Algorithm Button & Results (Right) -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
      
      <!-- Blank Workspace Canvas -->
      <div class="lg:col-span-8 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col h-[480px]">
        <div id="editor-lines-container" class="p-6 flex-1 overflow-y-auto space-y-1.5 font-mono text-sm bg-white rounded-xl">
          <!-- Dynamically populated invisible drop lines -->
        </div>
      </div>

      <!-- Test Button & Results -->
      <div class="lg:col-span-4 flex flex-col gap-3">
        <button id="btn-run" class="flex-1 min-h-[120px] bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 flex flex-col items-center justify-center p-5 gap-2 group border-2 border-emerald-400">
          <i class="fa-solid fa-play text-3xl group-hover:scale-110 transition-transform"></i>
          <span class="text-base font-black tracking-wider uppercase">Test Algorithm</span>
        </button>

        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between flex-1">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <span class="text-xs font-bold uppercase text-slate-500 tracking-wider">Accuracy</span>
            <span id="accuracy-badge" class="px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-600">Not Tested</span>
          </div>

          <div id="results-list" class="my-3 space-y-2 text-xs overflow-y-auto max-h-[260px]">
            <p class="text-slate-400 text-center italic py-2">Click TEST ALGORITHM to run</p>
          </div>
        </div>
      </div>

    </section>

    <!-- Bottom Palette: Commands & Variables -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-4">
      
      <!-- Palette Row 1: Commands -->
      <div>
        <span class="text-[11px] font-bold uppercase text-slate-400 tracking-wider block mb-2">1. Drag Commands</span>
        <div class="flex flex-wrap gap-2">
          
          <div draggable="true" data-category="command" data-value="IF" class="palette-item cursor-grab active:cursor-grabbing bg-amber-500 hover:bg-amber-600 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            IF
          </div>

          <div draggable="true" data-category="command" data-value="THEN" class="palette-item cursor-grab active:cursor-grabbing bg-amber-500 hover:bg-amber-600 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            THEN
          </div>

          <div draggable="true" data-category="command" data-value="ELSE IF" class="palette-item cursor-grab active:cursor-grabbing bg-amber-600 hover:bg-amber-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            ELSE IF
          </div>

          <div draggable="true" data-category="command" data-value="AND" class="palette-item cursor-grab active:cursor-grabbing bg-indigo-600 hover:bg-indigo-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            AND
          </div>

          <div draggable="true" data-category="command" data-value="OR" class="palette-item cursor-grab active:cursor-grabbing bg-purple-600 hover:bg-purple-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            OR
          </div>

          <div draggable="true" data-category="command" data-value="Classify as Pedestrian" class="palette-item cursor-grab active:cursor-grabbing bg-emerald-600 hover:bg-emerald-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            Classify as Pedestrian
          </div>

          <div draggable="true" data-category="command" data-value="Classify as Cyclist" class="palette-item cursor-grab active:cursor-grabbing bg-emerald-600 hover:bg-emerald-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            Classify as Cyclist
          </div>

          <div draggable="true" data-category="command" data-value="Classify as Car" class="palette-item cursor-grab active:cursor-grabbing bg-emerald-600 hover:bg-emerald-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            Classify as Car
          </div>

          <div draggable="true" data-category="command" data-value="Classify as Bus" class="palette-item cursor-grab active:cursor-grabbing bg-emerald-600 hover:bg-emerald-700 text-white font-mono text-xs font-bold px-3 py-1.5 rounded-md shadow-sm transition">
            Classify as Bus
          </div>

        </div>
      </div>

      <!-- Palette Row 2: Draggable Variables -->
      <div>
        <span class="text-[11px] font-bold uppercase text-slate-400 tracking-wider block mb-2">2. Drag Variables</span>
        <div class="flex flex-wrap items-center gap-4 py-1">

          <div draggable="true" data-category="variable" data-value="Vmax" class="palette-item cursor-grab active:cursor-grabbing text-blue-700 hover:text-blue-900 font-mono text-sm font-bold tracking-wide hover:bg-blue-50 px-2 py-0.5 rounded transition select-none flex items-center gap-1.5">
            <i class="fa-solid fa-grip-vertical text-slate-300 text-xs"></i> Vmax
          </div>

          <div draggable="true" data-category="variable" data-value="Vaverage" class="palette-item cursor-grab active:cursor-grabbing text-blue-700 hover:text-blue-900 font-mono text-sm font-bold tracking-wide hover:bg-blue-50 px-2 py-0.5 rounded transition select-none flex items-center gap-1.5">
            <i class="fa-solid fa-grip-vertical text-slate-300 text-xs"></i> Vaverage
          </div>

          <div draggable="true" data-category="variable" data-value="NumberStops" class="palette-item cursor-grab active:cursor-grabbing text-blue-700 hover:text-blue-900 font-mono text-sm font-bold tracking-wide hover:bg-blue-50 px-2 py-0.5 rounded transition select-none flex items-center gap-1.5">
            <i class="fa-solid fa-grip-vertical text-slate-300 text-xs"></i> NumberStops
          </div>

        </div>
      </div>

    </section>

  </main>

  <script>
    function generateBlindDatasets() {
      return [
        { id: 1, actualMode: "Pedestrian", vMax: 3.2, vAvg: 2.5, stops: 2 },
        { id: 2, actualMode: "Cyclist", vMax: 13.5, vAvg: 10.0, stops: 3 },
        { id: 3, actualMode: "Bus", vMax: 28.0, vAvg: 13.0, stops: 7 },
        { id: 4, actualMode: "Car", vMax: 38.0, vAvg: 25.0, stops: 2 }
      ];
    }

    let blindDatasets = [];

    const linesContainer = document.getElementById('editor-lines-container');
    const btnClear = document.getElementById('btn-clear');
    const btnRun = document.getElementById('btn-run');
    const resultsList = document.getElementById('results-list');
    const accuracyBadge = document.getElementById('accuracy-badge');

    let draggedPayload = null;
    const NUM_CANVAS_ROWS = 25;

    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        draggedPayload = {
          category: item.dataset.category,
          value: item.dataset.value
        };
        e.dataTransfer.setData('text/plain', JSON.stringify(draggedPayload));
      });
    });

    function initializeBlankCanvas() {
      linesContainer.innerHTML = '';
      for (let i = 1; i <= NUM_CANVAS_ROWS; i++) {
        createCanvasLine();
      }
    }

    function createCanvasLine() {
      const line = document.createElement('div');
      line.className = 'editor-line min-h-[32px] py-1 px-2 border-b border-transparent hover:border-slate-100 flex items-center gap-2 flex-wrap transition-colors';

      line.addEventListener('dragover', (e) => {
        e.preventDefault();
        line.classList.add('drop-line-hover');
      });

      line.addEventListener('dragleave', () => {
        line.classList.remove('drop-line-hover');
      });

      line.addEventListener('drop', (e) => {
        e.preventDefault();
        line.classList.remove('drop-line-hover');

        if (!draggedPayload) return;
        appendTokenToLine(line, draggedPayload.category, draggedPayload.value);
      });

      const clearLineBtn = document.createElement('button');
      clearLineBtn.className = 'ml-auto text-slate-300 hover:text-red-500 text-xs px-1.5 transition hidden';
      clearLineBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      clearLineBtn.title = 'Clear line';
      clearLineBtn.addEventListener('click', () => {
        clearLineTokens(line);
      });

      line.appendChild(clearLineBtn);
      linesContainer.appendChild(line);
      return line;
    }

    function clearLineTokens(line) {
      const elements = line.querySelectorAll('.token-item, .condition-input-inline');
      elements.forEach(el => el.remove());
      updateLineClearBtnVisibility(line);
    }

    function updateLineClearBtnVisibility(line) {
      const clearBtn = line.querySelector('.ml-auto');
      const tokenCount = line.querySelectorAll('.token-item').length;
      if (tokenCount > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    function appendTokenToLine(line, category, val) {
      const clearBtn = line.querySelector('.ml-auto');
      const token = document.createElement('div');

      if (category === 'command') {
        token.className = 'token-item flex items-center gap-1.5 font-mono text-xs rounded shadow-sm px-2.5 py-1 transition group';
        let bgColor = 'bg-amber-500';
        if (val === 'ELSE IF') bgColor = 'bg-amber-600';
        if (val === 'AND') bgColor = 'bg-indigo-600';
        if (val === 'OR') bgColor = 'bg-purple-600';
        if (val.startsWith('Classify as')) bgColor = 'bg-emerald-600';

        token.className += ` ${bgColor} text-white font-bold`;
        token.innerHTML = `<span class="command-text">${val}</span>`;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'text-white/60 hover:text-white text-xs ml-1 font-bold';
        removeBtn.innerHTML = '×';
        removeBtn.addEventListener('click', () => {
          token.remove();
          updateLineClearBtnVisibility(line);
        });
        token.appendChild(removeBtn);

        line.insertBefore(token, clearBtn);
      } 
      else if (category === 'variable') {
        token.className = 'token-item variable-token inline-flex items-center gap-1 text-blue-700 font-mono font-bold text-sm select-none py-0.5 px-1';
        token.setAttribute('data-var-name', val);
        token.innerHTML = `<span>${val}</span>`;

        const removeVarBtn = document.createElement('button');
        removeVarBtn.className = 'text-slate-400 hover:text-red-500 text-xs ml-0.5 font-bold';
        removeVarBtn.innerHTML = '×';
        removeVarBtn.addEventListener('click', () => {
          if (condInput && condInput.parentNode === line) condInput.remove();
          token.remove();
          updateLineClearBtnVisibility(line);
        });
        token.appendChild(removeVarBtn);

        const condInput = document.createElement('input');
        condInput.type = 'text';
        condInput.className = 'condition-input-inline bg-transparent border-b border-slate-300 focus:border-blue-500 font-mono text-xs text-slate-800 px-1 py-0.5 outline-none w-20';
        condInput.placeholder = '';

        line.insertBefore(token, clearBtn);
        line.insertBefore(condInput, clearBtn);

        setTimeout(() => condInput.focus(), 50);
      }

      updateLineClearBtnVisibility(line);
    }

    btnClear.addEventListener('click', () => {
      initializeBlankCanvas();
      resultsList.innerHTML = '<p class="text-slate-400 text-center italic py-2">Click TEST ALGORITHM to run</p>';
      accuracyBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-600';
      accuracyBadge.textContent = 'Not Tested';
    });

    function evaluateCondition(actualVal, condStr) {
      if (!condStr || actualVal === undefined || actualVal === null) return false;

      const match = condStr.trim().match(/^(<=|>=|<|>|==|=)?\s*(-?\d+(?:\.\d+)?)$/);
      if (!match) return false;

      const op = match[1] || '==';
      const targetVal = parseFloat(match[2]);

      switch(op) {
        case '<=': return actualVal <= targetVal;
        case '>=': return actualVal >= targetVal;
        case '<':  return actualVal < targetVal;
        case '>':  return actualVal > targetVal;
        case '==':
        case '=':  return Math.abs(actualVal - targetVal) < 0.01;
        default:   return false;
      }
    }

    btnRun.addEventListener('click', () => {
      const lines = Array.from(linesContainer.querySelectorAll('.editor-line'));
      
      let correctCount = 0;
      resultsList.innerHTML = '';

      blindDatasets.forEach(sample => {
        const predictedMode = runLogicOnSample(lines, sample);
        const isCorrect = predictedMode && (predictedMode.trim().toLowerCase() === sample.actualMode.toLowerCase());
        if (isCorrect) correctCount++;

        const resItem = document.createElement('div');
        resItem.className = `p-2 rounded flex flex-col gap-1 font-mono text-[11px] ${isCorrect ? 'bg-emerald-50 text-emerald-950 border border-emerald-200' : 'bg-red-50 text-red-950 border border-red-200'}`;
        
        let detailsHtml = '';
        if (isCorrect) {
          detailsHtml = `
            <div class="mt-1 pt-1 border-t border-emerald-200/60 grid grid-cols-3 gap-1 text-[10px] text-emerald-800">
              <span>Vmax: <strong>${sample.vMax}</strong></span>
              <span>Vavg: <strong>${sample.vAvg}</strong></span>
              <span>Stops: <strong>${sample.stops}</strong></span>
            </div>
          `;
        }

        resItem.innerHTML = `
          <div class="flex items-center justify-between">
            <span>Sample #${sample.id} (${sample.actualMode}): <strong>${predictedMode || 'Unclassified'}</strong></span>
            <span class="font-bold">${isCorrect ? '<i class="fa-solid fa-check text-emerald-600"></i> Pass' : '<i class="fa-solid fa-xmark text-red-600"></i> Fail'}</span>
          </div>
          ${detailsHtml}
        `;
        resultsList.appendChild(resItem);
      });

      const pct = Math.round((correctCount / blindDatasets.length) * 100);
      accuracyBadge.textContent = `${pct}% (${correctCount}/${blindDatasets.length})`;
      if (pct === 100) {
        accuracyBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300';
      } else if (pct >= 50) {
        accuracyBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300';
      } else {
        accuracyBadge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-800 border border-red-300';
      }
    });

    // Stream-based interpreter to handle both single-line and multi-line structures
    function runLogicOnSample(lines, sample) {
      // Step 1: Flatten all dropped tokens into a single sequential array
      const tokenStream = [];
      
      lines.forEach(line => {
        const children = Array.from(line.children);
        children.forEach((el, index) => {
          if (el.classList.contains('token-item')) {
            const cmdText = el.querySelector('.command-text')?.textContent?.trim();
            if (cmdText) {
              tokenStream.push({ type: 'COMMAND', value: cmdText });
            }

            const varName = el.getAttribute('data-var-name');
            if (varName) {
              const nextEl = children[index + 1];
              const condStr = (nextEl && nextEl.classList.contains('condition-input-inline')) ? nextEl.value : '';

              let actualVal = 0;
              if (varName === 'Vmax') actualVal = sample.vMax;
              else if (varName === 'Vaverage') actualVal = sample.vAvg;
              else if (varName === 'NumberStops') actualVal = sample.stops;

              const isPassed = evaluateCondition(actualVal, condStr);
              tokenStream.push({ type: 'CONDITION', varName, condStr, isPassed });
            }
          }
        });
      });

      // Step 2: Parse statements sequentially across lines
      let finalMode = null;
      let previousBlockPassed = false;

      let i = 0;
      while (i < tokenStream.length) {
        const token = tokenStream[i];

        if (token.type === 'COMMAND' && (token.value === 'IF' || token.value === 'ELSE IF')) {
          const isElseIf = (token.value === 'ELSE IF');
          i++;

          // Skip execution if 'ELSE IF' occurs after a successful 'IF' or 'ELSE IF'
          const shouldEvaluate = !(isElseIf && previousBlockPassed);

          let currentConditionResult = null;
          let currentOperator = null; // 'AND' or 'OR'
          let targetClassification = null;

          // Consume tokens until reaching a target classification
          while (i < tokenStream.length) {
            const t = tokenStream[i];

            if (t.type === 'CONDITION') {
              if (currentConditionResult === null) {
                currentConditionResult = t.isPassed;
              } else if (currentOperator === 'AND') {
                currentConditionResult = currentConditionResult && t.isPassed;
              } else if (currentOperator === 'OR') {
                currentConditionResult = currentConditionResult || t.isPassed;
              }
            } else if (t.type === 'COMMAND') {
              if (t.value === 'AND' || t.value === 'OR') {
                currentOperator = t.value;
              } else if (t.value.startsWith('Classify as')) {
                targetClassification = t.value.replace('Classify as', '').trim();
                i++;
                break; // Complete block parsed
              } else if (t.value === 'IF' || t.value === 'ELSE IF') {
                break; // Safety break for next block
              }
            }
            i++;
          }

          if (shouldEvaluate && currentConditionResult === true && targetClassification) {
            previousBlockPassed = true;
            if (!finalMode) {
              finalMode = targetClassification;
              return finalMode; // Classification complete
            }
          } else if (!isElseIf) {
            previousBlockPassed = false;
          }
        } else {
          i++;
        }
      }

      return finalMode;
    }

    window.addEventListener('DOMContentLoaded', () => {
      blindDatasets = generateBlindDatasets();
      initializeBlankCanvas();
    });
  </script>
</body>
</html>
